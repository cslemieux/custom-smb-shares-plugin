name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3']
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, json
          coverage: xdebug
      
      - name: Validate composer.json
        run: composer validate --strict
      
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Lint code (PSR-12)
        run: composer lint
      
      - name: Static analysis (PHPStan)
        run: composer analyze
      
      - name: Check JavaScript syntax
        run: composer check:js
      
      - name: Run unit tests
        run: composer test:unit
      
      - name: Run integration tests
        run: composer test:integration
      
      - name: Generate coverage report
        if: matrix.php-version == '8.1'
        run: composer test:coverage
      
      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.1'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/clover.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Security audit
        run: composer audit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking until E2E test rewrite is complete
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, json
          ini-values: short_open_tag=On
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      
      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2
      
      - name: Start ChromeDriver
        run: |
          chromedriver --port=9515 &
          sleep 2
          curl -sf http://localhost:9515/status | head -1
      
      - name: Run E2E tests
        run: |
          php -d short_open_tag=On vendor/bin/phpunit tests/e2e/ComprehensiveUITest.php --no-coverage --verbose
        env:
          CHROMEDRIVER_PORT: 9515
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          retention-days: 7
  
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, security, e2e]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Build package
        run: ./build.sh --fast
      
      - name: Verify package
        run: |
          echo "Package contents:"
          tar -tJf archive/*.txz
          echo ""
          echo "Package size:"
          ls -lh archive/*.txz
          echo ""
          echo "MD5 checksum:"
          cat archive/*.md5
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: |
            archive/*.txz
            archive/*.md5
          retention-days: 30
