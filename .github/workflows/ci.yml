name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, json
          coverage: xdebug
      
      - name: Validate composer.json
        run: composer validate --strict
      
      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Lint code (PSR-12)
        run: composer lint
      
      - name: Static analysis (PHPStan)
        run: composer analyze
      
      - name: Check JavaScript syntax
        run: composer check:js
      
      - name: Run unit tests
        run: composer test:unit
      
      - name: Run integration tests
        run: composer test:integration
      
      - name: Generate coverage report
        if: matrix.php-version == '8.1'
        run: composer test:coverage
      
      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.1'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/clover.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Security audit
        run: composer audit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, json
          ini-values: short_open_tag=On
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      
      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2
      
      - name: Start ChromeDriver
        run: |
          chromedriver --port=9515 &
          sleep 2
          curl -sf http://localhost:9515/status | head -1
      
      - name: Run E2E tests
        run: |
          # Start harness and capture a page for diagnostics
          php -d short_open_tag=On -r "
            require_once 'tests/harness/UnraidTestHarness.php';
            \$config = json_decode(file_get_contents('tests/configs/ComprehensiveUITest.json'), true);
            \$h = UnraidTestHarness::setup(\$config);
            sleep(2);
            echo 'Harness URL: ' . \$h['url'] . PHP_EOL;
            echo 'Harness dir: ' . \$h['harness_dir'] . PHP_EOL;
            \$html = @file_get_contents(\$h['url'] . '/Settings/SMBShares');
            echo 'Main page length: ' . strlen(\$html) . PHP_EOL;
            echo 'Has jQuery: ' . (strpos(\$html, 'jquery') !== false ? 'YES' : 'NO') . PHP_EOL;
            echo 'Has test-assets: ' . (strpos(\$html, 'test-assets') !== false ? 'YES' : 'NO') . PHP_EOL;
            \$addHtml = @file_get_contents(\$h['url'] . '/Settings/SMBSharesAdd');
            echo 'Add page length: ' . strlen(\$addHtml) . PHP_EOL;
            echo 'Add has jQuery: ' . (strpos(\$addHtml, 'jquery') !== false ? 'YES' : 'NO') . PHP_EOL;
            \$asset = @file_get_contents(\$h['url'] . '/test-assets/jquery-3.6.0.min.js');
            echo 'jQuery asset length: ' . strlen(\$asset) . PHP_EOL;
            UnraidTestHarness::teardown();
          " 2>&1 || true
          php -d short_open_tag=On vendor/bin/phpunit tests/e2e/ComprehensiveUITest.php --no-coverage --verbose
        env:
          CHROMEDRIVER_PORT: 9515
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          retention-days: 7
  
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, security, e2e]
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Build package
        run: ./build.sh --fast
      
      - name: Verify package
        run: |
          echo "Package contents:"
          tar -tJf archive/*.txz
          echo ""
          echo "Package size:"
          ls -lh archive/*.txz
          echo ""
          echo "MD5 checksum:"
          cat archive/*.md5
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: |
            archive/*.txz
            archive/*.md5
          retention-days: 30
