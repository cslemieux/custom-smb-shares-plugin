name: Release

on:
  # Manual-only. Releases are cut via scripts/release-to-public.sh + `gh release create`,
  # which builds the .txz locally and sets the matching MD5 in custom.smb.shares.plg.
  # A tag-triggered auto-release here duplicated that (release "already_exists" -> failed
  # runs + failure emails) and would attach a differently-hashed CI-built .txz, breaking
  # the .plg MD5. Left as workflow_dispatch so it can still be run by hand if ever needed.
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, json
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Run tests
        run: |
          composer lint
          composer analyze
          composer test:unit
          composer test:integration
      
      - name: Build package
        run: ./build.sh --fast
      
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Get MD5 checksum
        id: md5
        run: echo "MD5=$(cat archive/*.md5)" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Custom SMB Shares Plugin v${{ steps.version.outputs.VERSION }}
            
            ### Installation
            1. Go to Unraid WebGUI → Plugins → Install Plugin
            2. Paste this URL: `https://raw.githubusercontent.com/${{ github.repository }}/main/custom.smb.shares.plg`
            3. Click Install
            
            ### Changes
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
            
            ### Checksums
            ```
            ${{ steps.md5.outputs.MD5 }}  custom.smb.shares-${{ steps.version.outputs.VERSION }}-x86_64-1.txz
            ```
          files: |
            archive/*.txz
            archive/*.md5
            custom.smb.shares.plg
          draft: false
          prerelease: false
